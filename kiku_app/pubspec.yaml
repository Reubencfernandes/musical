name: kiku_ai
description: "Kiku AI for phones and Macs: write songs, reshape recordings and turn music into sheet music."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter_secure_storage: '>=9.2.2 <11.0.0'
  flutter_web_auth_2: '>=4.1.0 <6.0.0'
  http: ^1.6.0
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  record: '>=5.1.0 <8.0.0'
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kiku-mark.png
    - assets/performers/
    - assets/score/
  fonts:
    - family: Supreme
      fonts:
        - asset: assets/fonts/Supreme-Regular.ttf
    - family: Bespoke Stencil
      fonts:
        - asset: assets/fonts/BespokeStencil-Bold.ttf
          weight: 700
